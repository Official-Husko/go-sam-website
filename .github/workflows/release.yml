name: Build and release Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release vars
        id: vars
        run: |
          sha="$(git rev-parse --short HEAD)"
          image="$(echo "${GITHUB_REPOSITORY,,}" | tr '/' '-')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=${image}:${sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"
          echo "archive=${image}-${sha}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to a tarball
        run: |
          docker save '${{ steps.vars.outputs.tag }}' '${{ steps.vars.outputs.latest_tag }}' \
            | gzip > '${{ steps.vars.outputs.archive }}'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.sha }}
          name: ${{ steps.vars.outputs.sha }}
          files: ${{ steps.vars.outputs.archive }}
